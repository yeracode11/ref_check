server {
    server_name stellref.kz www.stellref.kz 111.88.143.155;

    client_max_body_size 25m;

    root /var/www/fridge-frontend;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass http://127.0.0.1:4000;
    }

    # Хешированные чанки Vite — долгий кэш
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html и SPA-fallback — всегда свежая версия после деплоя
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/stellref.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stellref.kz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = stellref.kz) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name stellref.kz www.stellref.kz 111.88.143.155;
    return 404;
}
